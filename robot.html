<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Robo Face</title>
<style>
  :root { --bg:#0b1a22; --fg:#e6f6f4; --muted:#8aa0ab; --card:#132630; --border:rgba(255,255,255,.12); --eye:#4ff0d0; --glow:rgba(79,240,208,.55); --think:#f5c84c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; border:none; }
  main { min-height:100dvh; display:flex; flex-direction:column; align-items:center; padding:1rem; gap:1rem; max-width:520px; margin:0 auto; }
  .bar { width:100%; display:flex; justify-content:space-between; gap:.5rem; }
  .chip { display:inline-flex; align-items:center; gap:.4rem; padding:.45rem .8rem; border-radius:999px; background:var(--card); border:1px solid var(--border); font-size:.8rem; }
  .chip:disabled { opacity:.5; }
  .dot { width:.5rem; height:.5rem; border-radius:999px; background:var(--muted); }
  .dot.on { background:var(--eye); box-shadow:0 0 8px var(--glow); }
  .panel { width:100%; background:var(--card); border:1px solid var(--border); border-radius:1rem; padding:.75rem; display:none; flex-direction:column; gap:.4rem; }
  .panel.show { display:flex; }
  .panel label { font-size:.75rem; color:var(--muted); }
  .panel input { background:var(--bg); border:1px solid var(--border); border-radius:.6rem; padding:.5rem .7rem; color:var(--fg); }
  .face { flex:1; width:100%; min-height:45dvh; display:flex; align-items:center; justify-content:center; gap:18%; cursor:pointer; }
  .eye { width:22%; aspect-ratio:3/4; background:var(--eye); border-radius:40%; box-shadow:0 0 40px var(--glow); transition:transform .35s cubic-bezier(.5,1.6,.4,1), background .3s; }
  .closed .eye { transform:scaleY(.07); }
  .open .eye { animation:blink 5s infinite; }
  .thinking .eye { background:var(--think); animation:think 1s ease-in-out infinite alternate; }
  @keyframes blink { 0%,94%,100% { transform:scaleY(1); } 97% { transform:scaleY(.1); } }
  @keyframes think { from { transform:scaleY(.8) translateX(-8%); } to { transform:scaleY(.8) translateX(8%); } }
  #reply { font-size:1.15rem; text-align:center; margin:0; }
  .small { font-size:.85rem; color:var(--muted); text-align:center; margin:0; }
  #start { background:var(--eye); color:var(--bg); font-weight:600; padding:.8rem 1.6rem; border-radius:999px; }
  #log { font-size:.75rem; color:var(--muted); text-align:center; font-family:ui-monospace,monospace; list-style:none; padding:0; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <button class="chip" id="connect"><span class="dot" id="dot"></span><span id="connText">Connect ESP32</span></button>
    <div style="display:flex;gap:.5rem">
      <button class="chip" id="settingsBtn">Settings</button>
      <button class="chip" id="fs" aria-label="Fullscreen">⛶</button>
    </div>
  </div>
  <div class="panel" id="panel">
    <label>Wake words (comma separated)</label>
    <input id="wake" />
    <label>Gemini API key</label>
    <input id="key" type="password" />
  </div>
  <section class="face closed" id="face"><div class="eye"></div><div class="eye"></div></section>
  <p id="reply">Say a wake word to wake me up.</p>
  <p class="small" id="heard"></p>
  <button id="start">Start listening</button>
  <p class="small" id="status"></p>
  <ul id="log"></ul>
</main>
<script>
const MODEL = "gemini-3.8-flash";
const DEFAULT_KEY = "AQ.Ab8RN6LtncvXznnncWnEmwlLsYXjL1mHt-HgOL0jIAMP5p66sg";
const DEFAULT_WAKE = "hey robot, wake up, hello robot";
const SLEEP_AFTER_MS = 20000;
const CODES = { forward:"F", backward:"B", left:"L", right:"R" };

const $ = (id) => document.getElementById(id);
const wakeInput = $("wake"), keyInput = $("key");
wakeInput.value = localStorage.getItem("wakeWords") || DEFAULT_WAKE;
keyInput.value = localStorage.getItem("geminiKey") || DEFAULT_KEY;
wakeInput.oninput = () => localStorage.setItem("wakeWords", wakeInput.value);
keyInput.oninput = () => localStorage.setItem("geminiKey", keyInput.value);
$("settingsBtn").onclick = () => $("panel").classList.toggle("show");

let awake = false, busy = false, sleepTimer = null, writer = null, rec = null;

function setFace(s) { $("face").className = "face " + s; }
function log(s) { const li = document.createElement("li"); li.textContent = s; $("log").prepend(li); while ($("log").children.length > 6) $("log").lastChild.remove(); }
function bumpSleep() { clearTimeout(sleepTimer); sleepTimer = setTimeout(sleep, SLEEP_AFTER_MS); }
function sleep() { awake = false; setFace("closed"); $("reply").textContent = "Zzz… say a wake word."; updateStatus(); }
function wake() { awake = true; setFace("open"); $("reply").textContent = "I'm awake! What should I do?"; bumpSleep(); updateStatus(); }
function updateStatus() { if (rec) $("status").textContent = awake ? "Listening for commands…" : "Sleeping — listening for wake word"; }
function speak(t) { if (!("speechSynthesis" in window)) return; speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }

$("face").onclick = () => awake ? sleep() : wake();
$("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();

// ---- USB serial to ESP32 ----
if (!("serial" in navigator)) { $("connect").disabled = true; $("connText").textContent = "USB unsupported"; }
$("connect").onclick = async () => {
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    $("dot").classList.add("on"); $("connText").textContent = "ESP32"; log("ESP32 connected");
  } catch { log("Connection cancelled"); }
};
async function sendCommand(name, amount) {
  if (!writer) throw new Error("not connected");
  await writer.write(new TextEncoder().encode(`${CODES[name]}:${amount}\n`));
}

// ---- Gemini ----
const tool = (name, description) => ({ name, description, parameters: { type:"OBJECT", properties:{ amount:{ type:"NUMBER", description:"How many steps/units" } }, required:["amount"] } });
async function askGemini(text) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`, {
    method: "POST",
    headers: { "Content-Type":"application/json", "x-goog-api-key": keyInput.value.trim() },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: "You are a small friendly robot. Keep spoken replies to one short sentence. When the user asks you to move, call the movement tools (forward, backward, left, right) with an amount. You may call several tools in order." }] },
      contents: [{ role:"user", parts:[{ text }] }],
      tools: [{ functionDeclarations: [tool("forward","Drive forward"), tool("backward","Drive backward"), tool("left","Turn left"), tool("right","Turn right")] }],
    }),
  });
  if (!res.ok) {
    if (res.status === 503) return { reply: "Gemini is busy right now, try again in a moment.", calls: [] };
    return { reply: `Gemini error ${res.status}.`, calls: [] };
  }
  const json = await res.json();
  const parts = json?.candidates?.[0]?.content?.parts ?? [];
  const calls = []; let reply = "";
  for (const p of parts) {
    if (p.functionCall && CODES[p.functionCall.name]) calls.push({ name: p.functionCall.name, amount: Math.max(1, Math.round(Number(p.functionCall.args?.amount) || 1)) });
    else if (p.text) reply += p.text;
  }
  return { reply: reply.trim() || (calls.length ? "On it!" : "Hmm, I didn't get that."), calls };
}

async function handleCommand(text) {
  if (/\b(go to sleep|sleep now|good ?night)\b/i.test(text)) { sleep(); return; }
  busy = true; setFace("thinking");
  try {
    const r = await askGemini(text);
    $("reply").textContent = r.reply; speak(r.reply);
    for (const c of r.calls) {
      log(`${c.name} × ${c.amount}`);
      try { await sendCommand(c.name, c.amount); } catch { log("⚠ ESP32 not connected"); }
    }
  } catch { $("reply").textContent = "Couldn't reach Gemini. Check your internet."; }
  busy = false; if (awake) setFace("open"); bumpSleep();
}

function onFinal(raw) {
  const text = raw.toLowerCase().trim();
  $("heard").textContent = `“${raw}”`;
  const words = wakeInput.value.split(",").map(w => w.trim().toLowerCase()).filter(Boolean);
  const hit = words.find(w => text.includes(w));
  if (!awake) {
    if (hit) { wake(); const rest = text.split(hit).slice(1).join(" ").trim(); if (rest.length > 2) handleCommand(rest); }
    return;
  }
  if (busy) return;
  const cmd = hit ? text.replace(hit, "").trim() : text;
  if (cmd.length > 1) handleCommand(cmd); else bumpSleep();
}

// ---- Built-in speech recognition ----
$("start").onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $("reply").textContent = "Speech recognition isn't supported here. Use Chrome or Edge."; return; }
  const r = new SR();
  r.continuous = true; r.interimResults = false; r.lang = "en-US";
  r.onresult = (e) => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) onFinal(e.results[i][0].transcript); };
  r.onend = () => { if (rec === r) try { r.start(); } catch {} };
  r.onerror = (e) => { if (e.error === "not-allowed") { rec = null; $("start").style.display = ""; $("reply").textContent = "Microphone permission denied."; } };
  rec = r; r.start();
  $("start").style.display = "none"; updateStatus();
};
</script>
</body>
</html>
